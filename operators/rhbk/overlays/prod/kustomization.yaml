apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rhbk

labels:
  - pairs:
      app.kubernetes.io/part-of: rhbk-platform
      environment: prod

resources:
  - ../../base

patches:
  - target:
      kind: OperatorGroup
    patch: |-
      - op: replace
        path: /spec/targetNamespaces/0
        value: rhbk
  # Existing OperatorGroup created by the console: keep its name to adopt it
  # (a second OperatorGroup in the namespace would break the operator).
  - target:
      kind: OperatorGroup
    patch: |-
      - op: replace
        path: /metadata/name
        value: rhbk-5htxv
