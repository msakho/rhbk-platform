# Converts the NooBaa bucket credentials into the Secret format expected by TempoStack
# (endpoint, bucket, access_key_id, access_key_secret) with ESO's "kubernetes" provider.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-local-secret-reader
  namespace: rhbk-tracing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-local-secret-reader
  namespace: rhbk-tracing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tempo-bucket"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-local-secret-reader
  namespace: rhbk-tracing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-local-secret-reader
subjects:
  - kind: ServiceAccount
    name: eso-local-secret-reader
    namespace: rhbk-tracing
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: local-secrets
  namespace: rhbk-tracing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    kubernetes:
      remoteNamespace: rhbk-tracing
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-local-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
  namespace: rhbk-tracing
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: local-secrets
  target:
    name: tempo-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        access_key_id: "{{ .access_key_id }}"
        access_key_secret: "{{ .access_key_secret }}"
        bucket: tempo-rhbk
        endpoint: https://s3.openshift-storage.svc:443
  data:
    - secretKey: access_key_id
      remoteRef:
        key: tempo-bucket
        property: AWS_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: access_key_secret
      remoteRef:
        key: tempo-bucket
        property: AWS_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
