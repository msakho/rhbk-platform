# Deployed by the ArgoCD Application "vault" (argocd/applications/vault.yaml).
# HashiCorp Vault for ESO, sandbox setup: 1 node, integrated Raft storage on a PVC
# (data survives cluster restarts; unsealed after each pod restart by the auto-unseal sidecar).
global:
  openshift: true

injector:
  enabled: false        # secrets are delivered by ESO, no sidecar injection

server:
  image:
    # Fully qualified: on OpenShift the short name resolves to registry.connect.redhat.com first.
    repository: docker.io/hashicorp/vault
    tag: "2.0.4"
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: ocs-storagecluster-ceph-rbd
  ha:
    enabled: true
    replicas: 1
    # No PodDisruptionBudget: with a single replica the chart's PDB (maxUnavailable: 0) allows no
    # disruption at all and blocks node drains during OpenShift upgrades.
    disruptionBudget:
      enabled: false
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}
  # Automatic unseal, SANDBOX ONLY: this sidecar restarts with the Vault pod and unseals Vault
  # with the key stored in Secret "vault-unseal-key" (created by hand, never in git, see README).
  # The key lives in the same cluster as the data it protects: anyone who can read this Secret
  # (or an etcd backup) can unseal Vault. Production: seal "awskms" / "transit" instead.
  extraContainers:
    - name: auto-unseal
      image: docker.io/hashicorp/vault:2.0.4
      command: ["/bin/sh", "-c"]
      args:
        - |
          export VAULT_ADDR=http://127.0.0.1:8200
          while true; do
            vault status >/dev/null 2>&1
            # exit code 2 = sealed (0 = unsealed, 1 = error / Vault not started yet)
            if [ $? -eq 2 ]; then
              vault operator unseal "$UNSEAL_KEY" >/dev/null && echo "$(date -u +%FT%TZ) unsealed"
            fi
            sleep 10
          done
      env:
        - name: UNSEAL_KEY
          valueFrom:
            secretKeyRef:
              name: vault-unseal-key
              key: key
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  route:
    enabled: true
    host: vault.apps.cluster-nnljw.nnljw.sandbox742.opentlc.com
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

ui:
  enabled: true
