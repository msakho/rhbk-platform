# Log store (LokiStack on a NooBaa bucket) and log forwarding (ClusterLogForwarder).
# Needs logging-operator and loki-operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: openshift-gitops
spec:
  project: platform
  source:
    repoURL: https://github.com/msakho/rhbk-platform.git
    targetRevision: main
    path: logging
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-logging
  syncPolicy:
    # Platform: manual sync (review the diff, then Sync).
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 6
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
